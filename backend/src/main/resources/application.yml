spring:
  application:
    name: audit-finding-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aft}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your@example.com}
    password: ${MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

flyway:
  enabled: true
  locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-prod}
  access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000} # 15 minutes
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000} # 7 days

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  ttl-seconds: 600 # 10 minutes cache TTL

files:
  upload-dir: ${FILES_UPLOAD_DIR:./uploads}

ai:
  service:
    url: ${AI_SERVICE_URL:http://ai-service:5000}
    timeout-ms: 30000

logging:
  level:
    root: INFO
    com.internship: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Security related
security:
  headers:
    content-security-policy: "default-src 'self'; script-src 'self'; object-src 'none'"
