spring:
  application:
    name: verityops-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verityops}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:12MB}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}

redis:
  ttl-seconds: 600

files:
  upload-dir: ${FILES_UPLOAD_DIR:./var/evidence}

ai:
  enabled: ${AI_ENABLED:false}
  service:
    url: ${AI_SERVICE_URL:http://ai-service:5000}
    timeout-ms: ${AI_TIMEOUT_MS:30000}

security:
  registration-enabled: ${SECURITY_REGISTRATION_ENABLED:false}
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}

logging:
  level:
    root: INFO
    com.internship: INFO

management:
  health:
    mail:
      enabled: ${NOTIFICATIONS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

notifications:
  enabled: ${NOTIFICATIONS_ENABLED:false}
  from: ${NOTIFICATIONS_FROM:verityops@localhost}
  application-url: ${APP_PUBLIC_URL:http://localhost:3000}
  poll-interval-ms: ${NOTIFICATIONS_POLL_INTERVAL_MS:30000}
