spring:
  application:
    name: audit-finding-tracker
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:audit_tracker}
    username: ${DATABASE_USER:audit_user}
    password: ${DATABASE_PASSWORD:SecurePassword123!@#}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 60000
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    root: INFO
    com.internship: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  
  file-upload:
    max-size: ${FILE_UPLOAD_MAX_SIZE:10485760}
    path: ${FILE_UPLOAD_PATH:/app/uploads}
    allowed-types: pdf,docx,doc,xlsx,xls,txt,png,jpg,jpeg
  
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:5000}
    timeout: ${AI_SERVICE_TIMEOUT:30}
  
  email:
    from: ${SMTP_FROM:noreply@audittrackerapp.com}
    from-name: ${SMTP_FROM_NAME:Audit Tracker}
  
  features:
    enable-rag: ${ENABLE_RAG:true}
    enable-email-notifications: ${ENABLE_EMAIL_NOTIFICATIONS:true}
    enable-audit-logging: ${ENABLE_AUDIT_LOGGING:true}

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    enable: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
